<rect x="1512" y="903" width="175" height="36" fill="#eeeeee" stroke="#303030"/>
<text x="1524" y="911" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="1524" dy="14">Choose action</tspan></text>
<text x="40" y="1130" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="20" fill="#303030"><tspan x="40" dy="20">Behavior and platform notes</tspan></text>
<text x="40" y="1173" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="15" fill="#303030"><tspan x="40" dy="15">GET /api/v1/home-assistant/entities supports only the domain query filter; no device or area registry exists.</tspan></text>
<text x="40" y="1202" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="15" fill="#303030"><tspan x="40" dy="15">Select a row to GET /entities/{id}. Use name, id, state, attributes, lastChanged, and lastUpdated from Core.</tspan></text>
<text x="40" y="1231" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="15" fill="#303030"><tspan x="40" dy="15">Loading: show a progress label. Empty: &quot;No entities in this domain&quot; with &quot;All domains&quot;. A missing entity returns 404.</tspan></text>
<text x="40" y="1260" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="15" fill="#303030"><tspan x="40" dy="15">Read failure: retain the last values marked stale with Retry. Display unknown and unavailable states as returned.</tspan></text>
<text x="40" y="1289" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="15" fill="#303030"><tspan x="40" dy="15">Poll only while visible. The bridge has no subscription; timestamps above are examples, not device completion times.</tspan></text>
<text x="40" y="1318" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="15" fill="#303030"><tspan x="40" dy="15">Windows/Mac use list and detail. iPhone/narrow iPad use consecutive panes; Quest uses headset.type and scrolling.</tspan></text>
<text x="40" y="1390" xml:space="preserve" style="white-space:pre" font-family="monospace" font-size="14" fill="#303030"><tspan x="40" dy="14">Proposal based on Core #147. API and source revisions: home-assistant.md. Example entities and values only.</tspan></text></svg>
