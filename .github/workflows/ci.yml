name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Builds dist/, runs the contrast and status tests, and fails if the committed dist/ is not what the tokens build.
      - run: npm run check
      - name: Compile the C header with the Windows client's warnings
        run: |
          printf '#include "briareus_tokens.h"\nint main(void) { return briareus_status_role("running") == BRIAREUS_STATUS_ACTIVE ? 0 : 1; }\n' > /tmp/t.c
          gcc -std=c11 -Wall -Wextra -Wshadow -Wformat=2 -Wpointer-arith -Wundef -Wvla -Wdouble-promotion \
            -Wstrict-prototypes -Wmissing-prototypes -Werror -Idist/c -o /tmp/t /tmp/t.c && /tmp/t
